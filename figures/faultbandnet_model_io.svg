#555"/><text x="1755.0" y="550.0" font-size="13" font-weight="400" text-anchor="middle" fill="#888">0.08</text><text x="1689.0" y="596" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Output 3 × 3 probabilities</text><text x="1689.0" y="614" font-size="12" font-weight="400" text-anchor="middle" fill="#555">(position × fault type)</text><text x="1689.0" y="632" font-size="12" font-weight="400" text-anchor="middle" fill="#555">≥ 0.5 → fault there</text><text x="1689.0" y="650" font-size="12" font-weight="400" text-anchor="middle" fill="#555">example: PWM at rear</text><rect x="1080" y="700" width="690" height="150" rx="10" fill="#FAFAFA" stroke="#bbb" stroke-width="1.4"/><text x="1425.0" y="740.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">How the 3 × 3 output is read</text><text x="1425.0" y="760.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">speaker (sector) is faulty  ←  max over the 3 fault types ≥ 0.5</text><text x="1425.0" y="780.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">recording has fault X  ←  max over the 3 positions ≥ 0.5</text><text x="1425.0" y="800.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">position of fault X  ←  position with the highest probability</text><text x="1425.0" y="820.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">Imbalance / Modulation are not outputs (labelled 0 = healthy)</text></svg>