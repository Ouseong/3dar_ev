<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="870" viewBox="0 0 1700 870" font-family="Helvetica, Arial, DejaVu Sans"><rect width="1700" height="870" fill="white"/><text x="850.0" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#222">FaultBandNet — training and evaluation</text><text x="850.0" y="70" font-size="15" font-weight="400" text-anchor="middle" fill="#555">each tested recording is predicted only by models that never heard any of its 3 source files</text><rect x="30" y="110" width="300" height="110" rx="10" fill="#F8D3D7" stroke="#555" stroke-width="1.4"/><text x="180.0" y="140.0" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Data: all 1,200 recordings</text><text x="180.0" y="160.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">Imbalance / Modulation → healthy (out of band)</text><text x="180.0" y="180.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">Whine/PWM/Wind count 0/1/2/3: 479/394/244/83</text><text x="180.0" y="200.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">input = 3 maps (Wind, PWM, Whine)</text><line x1="180" y1="220" x2="180.0" y2="250.0" stroke="#333" stroke-width="2"/><polygon points="180,260 175.0,250.0 185.0,250.0" fill="#333"/><rect x="30" y="260" width="300" height="150" rx="10" fill="#FFF4D6" stroke="#555" stroke-width="1.4"/><text x="180.0" y="300.0" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Label: 3 × 3 (position × fault)</text><text x="180.0" y="320.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">1 if that speaker plays</text><text x="180.0" y="340.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">Whine / PWM / Wind, else 0</text><text x="180.0" y="360.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">e.g. rear = PWM → [0 0 0 / 0 1 0 / 0 0 0]</text><text x="180.0" y="380.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">3x1 variant: max over types → [0 / 1 / 0]</text><line x1="330" y1="165" x2="410.0" y2="165.0" stroke="#333" stroke-width="2"/><polygon points="420,165 410.0,170.0 410.0,160.0" fill="#333"/><rect x="420" y="110" width="380" height="110" rx="10" fill="#E5E1F5" stroke="#555" stroke-width="1.4"/><text x="610.0" y="140.0" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Source-disjoint split, 30 repeats</text><text x="610.0" y="160.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">test: ~5.3 % of each fault count, all 3 sources in T</text><text x="610.0" y="180.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">train pool: no source file in T</text><text x="610.0" y="200.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">same share kept for each fault count (rest unused)</text><rect x="440" y="245" width="66" height="34" fill="#F8C4C4" stroke="#555"/><text x="473.0" y="267" font-size="13" font-weight="700" text-anchor="middle" fill="#222">test</text><rect x="510" y="245" width="66" height="34" fill="#C9E6F7" stroke="#555"/><text x="543.0" y="267" font-size="13" font-weight="400" text-anchor="middle" fill="#222">train</text><rect x="580" y="245" width="66" height="34" fill="#C9E6F7" stroke="#555"/><text x="613.0" y="267" font-size="13" font-weight="400" text-anchor="middle" fill="#222">train</text><rect x="650" y="245" width="66" height="34" fill="#C9E6F7" stroke="#555"/><text x="683.0" y="267" font-size="13" font-weight="400" text-anchor="middle" fill="#222">train</text><rect x="720" y="245" width="66" height="34" fill="#EEEEEE" stroke="#555"/><text x="753.0" y="267" font-size="13" font-weight="400" text-anchor="middle" fill="#222">unused</text><text x="610" y="299" font-size="12" font-weight="400" text-anchor="middle" fill="#555">per repeat: train 329–493 (mean 419), validation ~74, test 63</text><line x1="560" y1="300" x2="560.0" y2="330.0" stroke="#333" stroke-width="2"/><polygon points="560,340 555.0,330.0 565.0,330.0" fill="#333"/><rect x="420" y="340" width="380" height="70" rx="10" fill="#E5E1F5" stroke="#555" stroke-width="1.4"/><text x="610.0" y="370.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">train pool → 85 % train / 15 % validation</text><text x="610.0" y="390.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">per fault count; validation only for early stopping</text><line x1="610" y1="410" x2="610.0" y2="440.0" stroke="#333" stroke-width="2"/><polygon points="610,450 605.0,440.0 615.0,440.0" fill="#333"/><rect x="380" y="450" width="830" height="380" rx="16" fill="#F4F9FD" stroke="#7aa6c2" stroke-width="1.6" stroke-dasharray="8 5"/><text x="395" y="475" font-size="14" font-weight="700" text-anchor="start" fill="#2f5f80">repeated for each of 30 splits</text><rect x="410" y="495" width="230" height="90" rx="10" fill="#FFF" stroke="#555" stroke-width="1.4"/><text x="525.0" y="525.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Normalise inputs</text><text x="525.0" y="545.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">mean / std from</text><text x="525.0" y="565.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">training recordings only</text><line x1="640" y1="540" x2="680.0" y2="540.0" stroke="#333" stroke-width="2"/><polygon points="690,540 680.0,545.0 680.0,535.0" fill="#333"/><rect x="690" y="495" width="230" height="90" rx="10" fill="#C9E6F7" stroke="#555" stroke-width="1.4"/><text x="805.0" y="525.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Mini-batch (32)</text><text x="805.0" y="545.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">3 maps → FaultBandNet</text><text x="805.0" y="565.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">→ 3 × 3 logits</text><line x1="920" y1="540" x2="960.0" y2="540.0" stroke="#333" stroke-width="2"/><polygon points="970,540 960.0,545.0 960.0,535.0" fill="#333"/><rect x="970" y="495" width="220" height="90" rx="10" fill="#FCE1C6" stroke="#555" stroke-width="1.4"/><text x="1080.0" y="525.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">Loss: BCE</text><text x="1080.0" y="545.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">positive weight per output</text><text x="1080.0" y="565.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">= #neg / #pos (max 20)</text><line x1="1080" y1="585" x2="1080.0" y2="615.0" stroke="#333" stroke-width="2"/><polygon points="1080,625 1075.0,615.0 1085.0,615.0" fill="#333"/><rect x="970" y="625" width="220" height="70" rx="10" fill="#FCE1C6" stroke="#555" stroke-width="1.4"/><text x="1080.0" y="655.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">AdamW</text><text x="1080.0" y="675.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">lr 1e-3, weight decay 1e-3</text><line x1="970" y1="660" x2="930.0" y2="660.0" stroke="#333" stroke-width="2"/><polygon points="920,660 930.0,655.0 930.0,665.0" fill="#333"/><rect x="690" y="625" width="230" height="70" rx="10" fill="#DFF3E4" stroke="#555" stroke-width="1.4"/><text x="805.0" y="645.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">end of epoch</text><text x="805.0" y="665.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">validation AUC</text><text x="805.0" y="685.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">(3x3: per type, 3x1: per sector)</text><line x1="690" y1="660" x2="650.0" y2="660.0" stroke="#333" stroke-width="2"/><polygon points="640,660 650.0,655.0 650.0,665.0" fill="#333"/><rect x="410" y="615" width="230" height="90" rx="10" fill="#DFF3E4" stroke="#555" stroke-width="1.4"/><text x="525.0" y="645.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">keep best epoch</text><text x="525.0" y="665.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">early stop: no gain 15 epochs</text><text x="525.0" y="685.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">max 80 epochs</text><polyline points="525,615 525,603 805,603 805,595" fill="none" stroke="#333" stroke-width="2"/><line x1="805" y1="600" x2="805.0" y2="596.0" stroke="#333" stroke-width="2"/><polygon points="805,586 810.0,596.0 800.0,596.0" fill="#333"/><text x="665" y="597" font-size="12" font-weight="400" text-anchor="middle" fill="#555">next epoch</text><line x1="525" y1="705" x2="525.0" y2="735.0" stroke="#333" stroke-width="2"/><polygon points="525,745 520.0,735.0 530.0,735.0" fill="#333"/><rect x="410" y="745" width="300" height="60" rx="10" fill="#F8C4C4" stroke="#555" stroke-width="1.4"/><text x="560.0" y="770.0" font-size="14" font-weight="700" text-anchor="middle" fill="#222">predict the test set</text><text x="560.0" y="790.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">with the best-epoch weights</text><text x="1195" y="820" font-size="12" font-weight="400" text-anchor="end" fill="#555">GPU throttled to ~50 % (Spark heat limit)</text><line x1="710" y1="775" x2="1250.0" y2="775.0" stroke="#333" stroke-width="2"/><polygon points="1260,775 1250.0,780.0 1250.0,770.0" fill="#333"/><rect x="1260" y="715" width="410" height="120" rx="10" fill="#FFF4D6" stroke="#555" stroke-width="1.4"/><text x="1465.0" y="750.0" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Test probabilities</text><text x="1465.0" y="770.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">averaged over the repeats a recording was tested</text><text x="1465.0" y="790.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">1,158 of 1,200 recordings tested</text><text x="1465.0" y="810.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">test_probabilities_3x3.npy / _3x1.npy</text><line x1="1465" y1="715" x2="1465.0" y2="675.0" stroke="#333" stroke-width="2"/><polygon points="1465,665 1470.0,675.0 1460.0,675.0" fill="#333"/><rect x="1260" y="415" width="410" height="250" rx="10" fill="#FAFAFA" stroke="#bbb" stroke-width="1.4"/><text x="1465.0" y="475.0" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Evaluation (threshold 0.5, fixed)</text><text x="1465.0" y="495.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">per recording: has fault X? → detection rate,</text><text x="1465.0" y="515.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">false alarms on healthy 11/09, healthy 11/02,</text><text x="1465.0" y="535.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">and on other-fault recordings</text><text x="1465.0" y="555.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">per sector: is this speaker faulty?</text><text x="1465.0" y="575.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">→ healthy / fault sectors right, by fault count 0–3</text><text x="1465.0" y="595.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">position: highest-probability position</text><text x="1465.0" y="615.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">among recordings with one fault X</text><rect x="1260" y="110" width="410" height="150" rx="10" fill="#FAFAFA" stroke="#bbb" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1465.0" y="150.0" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Why not k-fold?</text><text x="1465.0" y="170.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">healthy source files are reused up to 12 times,</text><text x="1465.0" y="190.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">at several positions → no clean k-fold exists</text><text x="1465.0" y="210.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">earlier 5-fold grouped only the right speaker:</text><text x="1465.0" y="230.0" font-size="13" font-weight="400" text-anchor="middle" fill="#444">98 % of test recordings shared a source with training</text></svg>