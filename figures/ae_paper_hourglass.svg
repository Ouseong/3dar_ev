xt x="415.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="415.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Pool↓2</text><text x="517.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="517.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="517.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Pool↓2</text><text x="619.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="619.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="619.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Pool↓2</text><text x="721.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">ConvT↑2</text><text x="721.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="721.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="823.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">ConvT↑2</text><text x="823.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="823.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="925.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">ConvT↑2</text><text x="925.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="925.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="1027.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">ConvT↑2</text><text x="1027.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="1027.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="1129.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">ConvT↑2</text><text x="1129.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv</text><text x="1129.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">BN·ReLU</text><text x="1231.0" y="210.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">ConvT↑2</text><text x="1231.0" y="223.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Conv→1</text><text x="1231.0" y="236.0" font-size="9.5" font-weight="400" text-anchor="middle" fill="#333">Sigmoid</text><path d="M68,107.0 L68,99.0 L665.0,99.0 L665.0,107.0" fill="none" stroke="#666" stroke-width="1.2"/><text x="366.5" y="77.0" font-size="14" font-weight="600" text-anchor="middle" fill="#222">Encoder</text><text x="366.5" y="93.0" font-size="11" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">n = 6 blocks: Conv2d 3×3 (8 filters) → BatchNorm → ReLU → MaxPool 2×2</text><path d="M665.0,107.0 L665.0,99.0 L1262,99.0 L1262,107.0" fill="none" stroke="#666" stroke-width="1.2"/><text x="963.5" y="77.0" font-size="14" font-weight="600" text-anchor="middle" fill="#222">Decoder</text><text x="963.5" y="93.0" font-size="11" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">n−1 = 5 blocks: ConvTranspose2d → Conv2d → BN → ReLU, then output block</text><text x="665.0" y="281.0" font-size="11" font-weight="600" text-anchor="middle" fill="#B25E00">latent</text><text x="665.0" y="295.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#B25E00">16 values</text><text x="665.0" y="30.0" font-size="16" font-weight="600" text-anchor="middle" fill="#222">Paper CNN autoencoder (Kunte et al., Fig. 10) on one EV ROI view · n = 6, f = 8 · 7,753 parameters</text><text x="60.0" y="468.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">Input: 64 mel × 100 frames, clip −120…0 dBFS → [0, 1], padded to 128 frames (padding masked out of the loss).</text><text x="60.0" y="488.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">Train on Healthy views only: masked MSE, Adam 1e-4, batch 8, ≤ 100 epochs. Anomaly score = reconstruction error per ROI.</text><text x="60.0" y="508.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">Not in the paper (our choice): ConvTranspose2d kernel 2 stride 2; last Conv2d has 1 output channel. Box height ~ log2(freq rows), not to scale.</text></svg>