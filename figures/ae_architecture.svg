 x="290.0" y="649.0" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Per-mel z-score + pad 100 → 104 frames</text><text x="290.0" y="663.6" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">mean / std from train Healthy only · mask</text><path d="M290,628 L290.0,605.0" fill="none" stroke="#222" stroke-width="1.4"/><polygon points="290,596 294.5,605.0 285.5,605.0" fill="#222"/><rect x="100" y="490" width="380" height="106" rx="6" fill="#F3F3F3" stroke="#555" stroke-width="1.1"/><text x="290.0" y="518.0" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Recording-level split (seed 42 / 43 / 44)</text><text x="290.0" y="532.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">8 : 1 : 1, stratified fault-count × RPM band</text><text x="290.0" y="547.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">train: Healthy ROIs only (1,440)</text><text x="290.0" y="562.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">validation: Healthy + Fault (360) → stop &amp; threshold</text><text x="290.0" y="576.6" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">test: Healthy + Fault (360) → final score</text><path d="M290,490 L290.0,461.0" fill="none" stroke="#222" stroke-width="1.4"/><polygon points="290,452 294.5,461.0 285.5,461.0" fill="#222"/><text x="290" y="428.8" font-size="13" font-weight="600" text-anchor="middle" fill="#222">to autoencoder (b)</text><text x="290" y="444.6" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222">one view at a time: 1 × 64 × 104</text><text x="830" y="40.1" font-size="17" font-weight="600" text-anchor="middle" fill="#222">(b) Normal-only convolutional autoencoder</text><text x="830" y="60.0" font-size="11" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">ConvAE · latent 64 · fault = large reconstruction error</text><text x="830" y="137.0" font-size="12" font-weight="400" text-anchor="