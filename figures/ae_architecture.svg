<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1320" viewBox="0 0 1120 1320" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><rect width="1120" height="1320" fill="white"/><text x="290" y="40.1" font-size="17" font-weight="600" text-anchor="middle" fill="#222">(a) Input pipeline: 3 angular ROIs</text><text x="290" y="60.0" font-size="11" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">runs/baseline cache (id_views) · experiments/ae_20261119/train_ae.py</text><text x="290" y="137.0" font-size="12" font-weight="400" text-anchor="middle" fill="#444">Unit = one ROI of one recording (1,200 rec × 3 ROIs = 3,600)</text><text x="290" y="151.6" font-size="12" font-weight="400" text-anchor="middle" fill="#444">Healthy 1,800 · Fault 1,800 (5 types)</text><text x="290" y="1218.8" font-size="13" font-weight="600" text-anchor="middle" fill="#222">Inputs</text><text x="290" y="1234.6" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222">3-speaker recording (~4 s, 48 kHz) + encoder angle CSV</text><path d="M290,1196 L290.0,1167.0" fill="none" stroke="#222" stroke-width="1.4"/><polygon points="290,1158 294.5,1167.0 285.5,1167.0" fill="#222"/><rect x="150" y="1110" width="280" height="48" rx="6" fill="#F8D3D7" stroke="#555" stroke-width="1.1"/><text x="290.0" y="1130.8" font-size="13" font-weight="600" text-anchor="middle" fill="#222">Log-Mel Spectrogram</text><text x="290.0" y="1146.6" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222">64 mel · n_fft 2048 · hop 480 · 0–12 kHz · dB</text><path d="M290,1110 L290.0,1087.0" fill="none" stroke="#222" stroke-width="1.4"/><polygon points="290,1078 294.5,1087.0 285.5,1087.0" fill="#222"/><rect x="150" y="1030" width="280" height="48" rx="6" fill="#F8D3D7" stroke="#555" stroke-width="1.1"/><text x="290.0" y="1050.8" font-size="13" font-weight="600" text-anchor="middle" fill="#222">Angle → Time (encoder)</text><text x="290.0" y="1066.6" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222">each ROI = the time span of its angles</text><path d="M290,1030 L290.0,1009.0" fill="none" stroke="#222" stroke-width="1.4"/><polygon points="290,1000 294.5,1009.0 285.5,1009.0" fill="#222"/><path d="M290,920 L240.5,870.5 A70,70 0 0 0 240.5,969.5 Z" fill="#FCE1C6" stroke="#555" stroke-width="1"/><path d="M290,920 L240.5,969.5 A70,70 0 0 0 339.5,969.5 Z" fill="#CFEBD3" stroke="#555" stroke-width="1"/><path d="M290,920 L339.5,969.5 A70,70 0 0 0 339.5,870.5 Z" fill="#DCDDF3" stroke="#555" stroke-width="1"/><path d="M290,920 L339.5,870.5 A70,70 0 0 0 240.5,870.5 Z" fill="#FFFFFF" stroke="#555" stroke-width="1"/><circle cx="290" cy="920" r="22" fill="white" stroke="#555"/><text x="290" y="923.6" font-size="10" font-weight="400" text-anchor="middle" fill="#444">mic</text><text x="372.0" y="928.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">0°</text><text x="298.0" y="840.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">90°</text><text x="208.0" y="928.0" font-size="11" font-weight="400" text-anchor="end" fill="#444">180°</text><text x="298.0" y="1014.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">270°</text><text x="242.0" y="924.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">F</text><text x="290.0" y="972.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">R</text><text x="338.0" y="924.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">B</text><text x="290.0" y="876.0" font-size="11" font-weight="400" text-anchor="middle" fill="#888">—</text><text x="440" y="917.2" font-size="11" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">unused 45–135°</text><text x="440" y="930.7" font-size="11" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">(no ROI)</text><path d="M290,846 L290,812" fill="none" stroke="#222" stroke-width="1.4"/><path d="M115,812 L465,812" fill="none" stroke="#2