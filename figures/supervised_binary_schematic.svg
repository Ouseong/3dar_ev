<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><rect width="1500" height="760" fill="white"/><rect x="135" y="260" width="439" height="300" rx="12" fill="#F3F3F3" stroke="#888" stroke-dasharray="6 4"/><text x="750.0" y="36.1" font-size="17" font-weight="600" text-anchor="middle" fill="#222">Supervised Healthy / Fault model (senior-memo structure) — one angular ROI at a time</text><text x="750.0" y="56.1" font-size="11.5" font-weight="400" text-anchor="middle" fill="#666" font-style="italic">experiments/strict_split_20261123/run_binary_strict.py (same code as sup_binary_20261119) · strict source-disjoint split</text><rect x="30" y="88" width="210" height="64" rx="7" fill="#F8D3D7" stroke="#555" stroke-width="1.1"/><text x="135.0" y="109.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Input recording</text><text x="135.0" y="124.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">1 rotation ≈ 4 s · 48 kHz</text><text x="135.0" y="139.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">3 speakers + angle CSV</text><line x1="240" y1="120" x2="271.0" y2="120.0" stroke="#222" stroke-width="1.5"/><polygon points="280,120 271.0,124.5 271.0,115.5" fill="#222"/><rect x="280" y="88" width="250" height="64" rx="7" fill="#F8D3D7" stroke="#555" stroke-width="1.1"/><text x="405.0" y="109.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Cut 3 angular ROIs (≈1 s)</text><text x="405.0" y="124.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">FRONT 135–225° · RIGHT 225–315°</text><text x="405.0" y="139.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">REAR 315–360° | 0–45° (2 views)</text><line x1="530" y1="120" x2="561.0" y2="120.0" stroke="#222" stroke-width="1.5"/><polygon points="570,120 561.0,124.5 561.0,115.5" fill="#222"/><rect x="570" y="88" width="250" height="64" rx="7" fill="#F8D3D7" stroke="#555" stroke-width="1.1"/><text x="695.0" y="109.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Log-Mel per view</text><text x="695.0" y="124.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">64 mel · 0–12 kHz · hop 10 ms</text><text x="695.0" y="139.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">≤ 100 frames (+ mask)</text><line x1="820" y1="120" x2="851.0" y2="120.0" stroke="#222" stroke-width="1.5"/><polygon points="860,120 851.0,124.5 851.0,115.5" fill="#222"/><rect x="860" y="88" width="250" height="64" rx="7" fill="#F3F5C4" stroke="#555" stroke-width="1.1"/><text x="985.0" y="109.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Normalize</text><text x="985.0" y="124.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">per-mel z-score</text><text x="985.0" y="139.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">(mean/std from train ROIs)</text><line x1="1110" y1="120" x2="1141.0" y2="120.0" stroke="#222" stroke-width="1.5"/><polygon points="1150,120 1141.0,124.5 1141.0,115.5" fill="#222"/><rect x="1150" y="88" width="320" height="64" rx="7" fill="#F3F3F3" stroke="#555" stroke-width="1.1"/><text x="1310.0" y="109.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Each ROI judged separately</text><text x="1310.0" y="124.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">no information from the other ROIs</text><text x="1310.0" y="139.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">label = class of THAT speaker (Healthy / Fault)</text><polygon points="40,305.0 48,297.0 62,297.0 54,305.0" fill="#F8D3D7" stroke="#555" opacity=".8"/><polygon points="54,305.0 62,297.0 62,487.0 54,495.0" fill="#F8D3D7" stroke="#555" opacity=".6"/><rect x="40" y="305.0" width="14" height="190" fill="#F8D3D7" stroke="#555"/><text x="47.0" y="517.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">input view</text><text x="47.0" y="533.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">1 × 64 × 100</text><line x1="70" y1="400" x2="135.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="144,400 135.0,404.5 135.0,395.5" fill="#222"/><text x="110.0" y="363.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">Conv 3×3</text><text x="110.0" y="376.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">1→32</text><text x="110.0" y="389.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">GN·GELU·Pool2</text><polygon points="150,325.0 158,317.0 182,317.0 174,325.0" fill="#C9E6F7" stroke="#555" opacity=".8"/><polygon points="174,325.0 182,317.0 182,467.0 174,475.0" fill="#C9E6F7" stroke="#555" opacity=".6"/><rect x="150" y="325.0" width="24" height="150" fill="#C9E6F7" stroke="#555"/><text x="162.0" y="497.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">E1</text><text x="162.0" y="513.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">32 × 32 × 50</text><line x1="188" y1="400" x2="279.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="288,400 279.0,404.5 279.0,395.5" fill="#222"/><text x="241.0" y="363.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">Conv 3×3</text><text x="241.0" y="376.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">32→64</text><text x="241.0" y="389.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">GN·GELU·Pool2</text><polygon points="294,345.0 302,337.0 336,337.0 328,345.0" fill="#C9E6F7" stroke="#555" opacity=".8"/><polygon points="328,345.0 336,337.0 336,447.0 328,455.0" fill="#C9E6F7" stroke="#555" opacity=".6"/><rect x="294" y="345.0" width="34" height="110" fill="#C9E6F7" stroke="#555"/><text x="311.0" y="477.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">E2</text><text x="311.0" y="493.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">64 × 16 × 25</text><line x1="342" y1="400" x2="433.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="442,400 433.0,404.5 433.0,395.5" fill="#222"/><text x="395.0" y="363.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">Conv 3×3</text><text x="395.0" y="376.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">64→128</text><text x="395.0" y="389.6" font-size="10" font-weight="400" text-anchor="middle" fill="#222">GN·GELU·Pool2</text><polygon points="448,362.5 456,354.5 502,354.5 494,362.5" fill="#C9E6F7" stroke="#555" opacity=".8"/><polygon points="494,362.5 502,354.5 502,429.5 494,437.5" fill="#C9E6F7" stroke="#555" opacity=".6"/><rect x="448" y="362.5" width="46" height="75" fill="#C9E6F7" stroke="#555"/><text x="471.0" y="459.8" font-size="12" font-weight="600" text-anchor="middle" fill="#222">E3</text><text x="471.0" y="475.5" font-size="11" font-weight="400" text-anchor="middle" fill="#444">128 × 8 × 12</text><text x="354.5" y="282.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">CNN encoder (shared for all positions and views)</text><line x1="508" y1="400" x2="565.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="574,400 565.0,404.5 565.0,395.5" fill="#222"/><rect x="574" y="360" width="150" height="80" rx="7" fill="#DCDDF3" stroke="#555" stroke-width="1.1"/><text x="649.0" y="382.6" font-size="11.5" font-weight="600" text-anchor="middle" fill="#222">Masked Avg Pool</text><text x="649.0" y="397.0" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">→ vector 128</text><text x="649.0" y="411.3" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">REAR: 2 views</text><text x="649.0" y="425.7" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">duration-weighted</text><line x1="724" y1="400" x2="755.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="764,400 755.0,404.5 755.0,395.5" fill="#222"/><rect x="764" y="360" width="170" height="80" rx="7" fill="#C9E6F7" stroke="#555" stroke-width="1.1"/><text x="849.0" y="382.6" font-size="11.5" font-weight="600" text-anchor="middle" fill="#222">FCN</text><text x="849.0" y="397.0" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">Linear 128→128</text><text x="849.0" y="411.3" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">GELU · Dropout 0.2</text><text x="849.0" y="425.7" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">Linear 128→64 · GELU</text><line x1="934" y1="400" x2="965.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="974,400 965.0,404.5 965.0,395.5" fill="#222"/><rect x="974" y="372" width="90" height="56" rx="7" fill="#FCE1C6" stroke="#555" stroke-width="1.1"/><text x="1019.0" y="396.8" font-size="12" font-weight="600" text-anchor="middle" fill="#222">latent</text><text x="1019.0" y="411.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">64</text><line x1="1064" y1="400" x2="1095.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="1104,400 1095.0,404.5 1095.0,395.5" fill="#222"/><rect x="1104" y="360" width="150" height="80" rx="7" fill="#DCDDF3" stroke="#555" stroke-width="1.1"/><text x="1179.0" y="382.6" font-size="11.5" font-weight="600" text-anchor="middle" fill="#222">Decoder</text><text x="1179.0" y="397.0" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">Linear 64 → 2</text><text x="1179.0" y="411.3" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">(classifier,</text><text x="1179.0" y="425.7" font-size="10.0" font-weight="400" text-anchor="middle" fill="#222">not reconstruction)</text><line x1="1254" y1="400" x2="1275.0" y2="400.0" stroke="#222" stroke-width="1.5"/><polygon points="1284,400 1275.0,404.5 1275.0,395.5" fill="#222"/><rect x="1284" y="360" width="130" height="80" rx="7" fill="#CFEBD3" stroke="#555" stroke-width="1.1"/><text x="1349.0" y="389.3" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Softmax</text><text x="1349.0" y="404.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">P(Fault) ≥ 0.5</text><text x="1349.0" y="419.3" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">→ Fault</text><rect x="40" y="600" width="700" height="120" rx="7" fill="#FFFFFF" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/><text x="390.0" y="641.8" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Training (supervised: sees BOTH Healthy and Fault labels)</text><text x="390.0" y="656.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">loss = cross-entropy (2 classes) per ROI · AdamW lr 1e-4, wd 1e-5</text><text x="390.0" y="671.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">batch 16 recordings (= 48 ROIs) · ≤ 50 epochs · early stop patience 10</text><text x="390.0" y="686.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">checkpoint = best validation macro-F1 · GPU duty ~50%</text><rect x="780" y="600" width="680" height="120" rx="7" fill="#FFFFFF" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/><text x="1120.0" y="641.8" font-size="12" font-weight="600" text-anchor="middle" fill="#222">Data (strict split, seed 42 / 43 / 44)</text><text x="1120.0" y="656.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">source files assigned to train / val / test; recordings mixing splits dropped</text><text x="1120.0" y="671.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">train 713 / 658 / 651 rec (×3 ROIs) · test 88 / 81 / 81 rec · source overlap 0</text><text x="1120.0" y="686.8" font-size="10.5" font-weight="400" text-anchor="middle" fill="#222">test AUC 0.949 (hard healthy only 0.829) · accuracy 0.875</text><rect x="40" y="736" width="14" height="14" rx="3" fill="#F8D3D7" stroke="#555"/><text x="60" y="747" font-size="11.5" fill="#333">input</text><rect x="115.5" y="736" width="14" height="14" rx="3" fill="#F3F5C4" stroke="#555"/><text x="135.5" y="747" font-size="11.5" fill="#333">normalization</text><rect x="241.39999999999998" y="736" width="14" height="14" rx="3" fill="#C9E6F7" stroke="#555"/><text x="261.4" y="747" font-size="11.5" fill="#333">conv / MLP</text><rect x="348.4" y="736" width="14" height="14" rx="3" fill="#DCDDF3" stroke="#555"/><text x="368.4" y="747" font-size="11.5" fill="#333">pooling / linear</text><rect x="493.2" y="736" width="14" height="14" rx="3" fill="#FCE1C6" stroke="#555"/><text x="513.2" y="747" font-size="11.5" fill="#333">latent</text><rect x="575.0" y="736" width="14" height="14" rx="3" fill="#CFEBD3" stroke="#555"/><text x="595.0" y="747" font-size="11.5" fill="#333">output</text></svg>