[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ev3dar-baseline"
version = "0.1.0"
description = "Portable supervised3DAR_EV replay-recording baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
include = ["ev3dar*"]

# Install/verify a CUDA-capable PyTorch environment on DGX Spark separately.
# Deliberately no automatic torch/tensorflow/BEATs/YAMNet download dependency.
